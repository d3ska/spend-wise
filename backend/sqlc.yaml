version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "store"
        out: "store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
