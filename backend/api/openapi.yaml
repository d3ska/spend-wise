openapi: "3.1.0"
info:
  title: SpendWise API
  description: Collaborative household financial ledger API
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Server health checks
  - name: Auth
    description: OAuth2 SSO authentication (Google, GitHub)
  - name: Workspaces
    description: Workspace CRUD and member management
  - name: Categories
    description: Category CRUD scoped to workspace
  - name: Transactions
    description: Transaction CRUD and CSV import
  - name: Funding
    description: Monthly funding contributions
  - name: Rules
    description: Categorization rules
  - name: Summary
    description: Spending summary and analytics

paths:
  # ──────────────────────────────────────────
  # Health
  # ──────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Server health check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  # ──────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────
  /api/v1/auth/{provider}/url:
    get:
      operationId: getAuthURL
      tags: [Auth]
      summary: Get OAuth2 authorization URL
      parameters:
        - $ref: "#/components/parameters/AuthProvider"
      responses:
        "200":
          description: OAuth authorization URL with CSRF state
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    example: "https://accounts.google.com/o/oauth2/auth?client_id=..."
                  state:
                    type: string
                    description: CSRF state token (32 bytes, base64url)
                required: [url, state]
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/{provider}/callback:
    post:
      operationId: authCallback
      tags: [Auth]
      summary: Exchange OAuth2 code for JWT and user profile
      parameters:
        - $ref: "#/components/parameters/AuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCallbackRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCallbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get currently authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────
  # Workspaces
  # ──────────────────────────────────────────
  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      tags: [Workspaces]
      summary: Create a new workspace
      description: Creates a workspace and adds the authenticated user as owner.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      summary: List workspaces the user is a member of
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags: [Workspaces]
      summary: Get workspace by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateWorkspace
      tags: [Workspaces]
      summary: Update workspace (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteWorkspace
      tags: [Workspaces]
      summary: Delete workspace (owner only)
      description: Permanently deletes the workspace and all associated data (members, categories, transactions, funding).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          description: Workspace deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────
  # Workspace Members
  # ──────────────────────────────────────────
  /api/v1/workspaces/{workspaceId}/members:
    post:
      operationId: addMember
      tags: [Workspaces]
      summary: Add a member to workspace (owner only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/workspaces/{workspaceId}/members/{userId}:
    delete:
      operationId: removeMember
      tags: [Workspaces]
      summary: Remove a member from workspace (owner only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────
  # Categories
  # ──────────────────────────────────────────
  /api/v1/workspaces/{workspaceId}/categories:
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Create a category in workspace (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Category name already exists in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: listCategories
      tags: [Categories]
      summary: List categories in workspace (viewer+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/workspaces/{workspaceId}/categories/{categoryId}:
    put:
      operationId: updateCategory
      tags: [Categories]
      summary: Update a category (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteCategory
      tags: [Categories]
      summary: Delete a category (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────
  # Transactions
  # ──────────────────────────────────────────
  /api/v1/workspaces/{workspaceId}/transactions:
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Create a transaction with entries (editor+ required)
      description: |
        Creates a transaction with one or more entries. Each entry assigns an amount
        to a category and optionally a participant. Entry amounts MUST sum to the
        transaction total.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List transactions in date range (viewer+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-02-01"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-03-01"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/workspaces/{workspaceId}/transactions/import:
    post:
      operationId: importTransactions
      tags: [Transactions]
      summary: Import transactions from CSV (editor+ required)
      description: |
        Imports transactions from a CSV file. Duplicate fingerprints are skipped.
        Returns the list of created transactions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                    description: Number of transactions imported
                  skipped:
                    type: integer
                    description: Number of duplicates skipped
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransactionResponse"
                required: [imported, skipped, transactions]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/workspaces/{workspaceId}/transactions/{transactionId}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Get transaction with entries (viewer+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Transaction details with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: Delete a transaction (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "204":
          description: Transaction deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────
  # Funding
  # ──────────────────────────────────────────
  /api/v1/workspaces/{workspaceId}/fundings:
    put:
      operationId: upsertFunding
      tags: [Funding]
      summary: Set funding for a user in a year-month (editor+ required)
      description: Creates or updates a funding record. Unique per (workspace, user, year_month).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFundingRequest"
      responses:
        "200":
          description: Funding saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      operationId: listFundings
      tags: [Funding]
      summary: List fundings in date range (viewer+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-12-31"
      responses:
        "200":
          description: List of fundings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FundingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────
  # Rules
  # ──────────────────────────────────────────
  /api/v1/workspaces/{workspaceId}/rules:
    post:
      operationId: createRule
      tags: [Rules]
      summary: Create a categorization rule (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      operationId: listRules
      tags: [Rules]
      summary: List categorization rules (viewer+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/workspaces/{workspaceId}/rules/{ruleId}:
    put:
      operationId: updateRule
      tags: [Rules]
      summary: Update a categorization rule (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteRule
      tags: [Rules]
      summary: Delete a categorization rule (editor+ required)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: Rule deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────
  /api/v1/workspaces/{workspaceId}/summary:
    get:
      operationId: getSpendingSummary
      tags: [Summary]
      summary: Get spending summary for any date range (viewer+ required)
      description: |
        Returns aggregated spending data for the given date range. The UI decides
        the granularity (month, week, day, custom) — the backend always uses
        `WHERE date >= from AND date < to`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: from
          in: query
          required: true
          description: Start date (inclusive)
          schema:
            type: string
            format: date
            example: "2026-02-01"
        - name: to
          in: query
          required: true
          description: End date (exclusive)
          schema:
            type: string
            format: date
            example: "2026-03-01"
      responses:
        "200":
          description: Spending summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingSummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

# ════════════════════════════════════════════
# Components
# ════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtained from `/api/v1/auth/{provider}/callback`

  parameters:
    AuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, github]

    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Common ──
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "workspace not found"
      required: [error]

    Money:
      type: object
      description: Monetary amount with currency
      properties:
        amount:
          type: string
          description: Decimal amount as string for precision
          example: "150.75"
        currency:
          type: string
          default: PLN
          example: PLN
      required: [amount, currency]

    # ── Auth ──
    AuthCallbackRequest:
      type: object
      properties:
        code:
          type: string
          description: OAuth2 authorization code
        state:
          type: string
          description: CSRF state token
      required: [code]

    AuthCallbackResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT session token
        user:
          $ref: "#/components/schemas/UserResponse"
      required: [token, user]

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
      required: [id, email, display_name, avatar_url]

    # ── Workspaces ──
    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Home
        description:
          type: string
          minLength: 1
          example: Household expenses
      required: [name, description]

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
      required: [name, description]

    WorkspaceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        owner_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, description, owner_id, created_at, updated_at]

    AddMemberRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        role:
          type: string
          enum: [editor, viewer]
      required: [user_id, role]

    MemberResponse:
      type: object
      properties:
        workspace_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        role:
          type: string
          enum: [owner, editor, viewer]
        created_at:
          type: string
          format: date-time
      required: [workspace_id, user_id, role, created_at]

    # ── Categories ──
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Groceries
        icon:
          type: string
          example: cart
          default: ""
      required: [name]

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        icon:
          type: string
      required: [name]

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        workspace_id:
          type: integer
          format: int64
        name:
          type: string
        icon:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, workspace_id, name, icon, created_at, updated_at]

    # ── Transactions ──
    CreateTransactionRequest:
      type: object
      properties:
        description:
          type: string
          example: Weekly groceries at Biedronka
        date:
          type: string
          format: date
          example: "2026-02-12"
        total_amount:
          $ref: "#/components/schemas/Money"
        notes:
          type: string
          default: ""
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateEntryRequest"
      required: [description, date, total_amount, entries]

    CreateEntryRequest:
      type: object
      properties:
        category_id:
          type: integer
          format: int64
        participant_id:
          type: integer
          format: int64
          nullable: true
          description: User ID of the participant (null = unassigned)
        amount:
          $ref: "#/components/schemas/Money"
        note:
          type: string
          default: ""
      required: [category_id, amount]

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        workspace_id:
          type: integer
          format: int64
        created_by:
          type: integer
          format: int64
        description:
          type: string
        date:
          type: string
          format: date
        total_amount:
          $ref: "#/components/schemas/Money"
        source:
          type: string
          enum: [manual, import]
        notes:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EntryResponse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, workspace_id, created_by, description, date, total_amount, source, entries, created_at, updated_at]

    EntryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        participant_id:
          type: integer
          format: int64
          nullable: true
        amount:
          $ref: "#/components/schemas/Money"
        note:
          type: string
      required: [id, category_id, amount]

    # ── Funding ──
    UpsertFundingRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        year_month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          example: "2026-02"
        amount:
          $ref: "#/components/schemas/Money"
      required: [user_id, year_month, amount]

    FundingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        workspace_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        year_month:
          type: string
          example: "2026-02"
        amount:
          $ref: "#/components/schemas/Money"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, workspace_id, user_id, year_month, amount, created_at, updated_at]

    # ── Rules ──
    CreateRuleRequest:
      type: object
      properties:
        match_pattern:
          type: string
          description: Text pattern to match against transaction description
          example: "biedronka"
        target_category_id:
          type: integer
          format: int64
        priority:
          type: integer
          default: 0
          description: Higher priority rules take precedence
      required: [match_pattern, target_category_id]

    UpdateRuleRequest:
      type: object
      properties:
        match_pattern:
          type: string
        target_category_id:
          type: integer
          format: int64
        priority:
          type: integer
      required: [match_pattern, target_category_id]

    RuleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        workspace_id:
          type: integer
          format: int64
        match_pattern:
          type: string
        target_category_id:
          type: integer
          format: int64
        priority:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, workspace_id, match_pattern, target_category_id, priority, created_at, updated_at]

    # ── Summary ──
    SpendingSummaryResponse:
      type: object
      properties:
        workspace_id:
          type: integer
          format: int64
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        total_spent:
          $ref: "#/components/schemas/Money"
        by_category:
          type: array
          items:
            type: object
            properties:
              category:
                $ref: "#/components/schemas/CategoryResponse"
              spent:
                $ref: "#/components/schemas/Money"
            required: [category, spent]
        by_participant:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: "#/components/schemas/UserResponse"
              spent:
                $ref: "#/components/schemas/Money"
              funded:
                $ref: "#/components/schemas/Money"
              balance:
                $ref: "#/components/schemas/Money"
                description: funded - spent
            required: [user, spent, funded, balance]
      required: [workspace_id, from, to, total_spent, by_category, by_participant]
